<!DOCTYPE html>
<html lang="en">
<head>
    <title>selectors</title>
    <style>
    h1 ~ p {
        color: red;
    }
    h1 + p {
        color: blue;
    }
    #p2,#p3 {
        color: green;
    }
    </style>
</head>
<body>
    <h1>This is suhail</h1>
    <p>this is para1</p>
    <p id="p2">this is para2</p>
    <p>this is para3</p>
    <p id="p3">this is para4</p>
    <p>this is para5</p>
</body>
</html>
