<!DOCTYPE html>
<html lang="en">
<head>
    <title>borders</title>
    <style>
        h1{
            border: 5px;
            border-color: aqua;
            border-style: solid;
            text-align: center;
            display: inline;
            padding: 30px ;
            margin: 5px;
        }
        h1#p{
            border: 5px;
            border-color: blueviolet;
            border-style: double;
            text-align: center;
            display: inline;
        }
    </style>
</head>
<br/>
<br/>
<body>
    
    <h1>This is border</h1>
    <h1 id="p">BORDERS</h1>
</body>
</html>
